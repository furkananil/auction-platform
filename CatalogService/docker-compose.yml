services:
  catalogdb:
    image: postgres:16
    container_name: catalogdb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-CatalogDb}
    ports:
      - "5434:5432"

  catalogapi:
    image: catalog-service
    build:
      context: .
      dockerfile: CatalogService.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=catalogdb;Port=5432;Database=${POSTGRES_DB:-CatalogDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-change-me}
    depends_on:
      - catalogdb