syntax = "proto3";

option csharp_namespace = "PaymentService.Api.Protos";

service PaymentGrpc {
  rpc ProcessPayment (PaymentRequest) returns (PaymentResponse);
}

message PaymentRequest {
  string orderId = 1;
  string buyerId = 2;
  double amount = 3;
}

message PaymentResponse {
  bool success = 1;
  string transactionId = 2;
  string message = 3;
}