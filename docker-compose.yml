services:
  catalogdb:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${CATALOG_POSTGRES_DB:-CatalogDb}
    ports:
      - "5434:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      - catalogdb_data:/var/lib/postgresql/data
    networks:
      - auction-net

  catalogapi:
    build:
      context: ./CatalogService
      dockerfile: CatalogService.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:8080"
      - "5003:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=catalogdb;Port=5432;Database=${CATALOG_POSTGRES_DB:-CatalogDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-change-me}
    depends_on:
      - catalogdb
    networks:
      - auction-net

  biddingdb:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${BIDDING_POSTGRES_DB:-BiddingDb}
    ports:
      - "5435:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      - biddingdb_data:/var/lib/postgresql/data
    networks:
      - auction-net

  auctiondb:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${AUCTION_POSTGRES_DB:-AuctionDb}
    ports:
      - "5436:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      - auctiondb_data:/var/lib/postgresql/data
    networks:
      - auction-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - auction-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - auction-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - auction-net

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: notification
      RABBITMQ_DEFAULT_PASS: notification123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - auction-net

  biddingapi:
    build:
      context: ./BiddingService
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=biddingdb;Port=5432;Database=${BIDDING_POSTGRES_DB:-BiddingDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-change-me}
      Kafka__BootstrapServers: kafka:9093
      GrpcSettings__CatalogUrl: http://catalogapi:8081
    depends_on:
      - biddingdb
      - kafka
    networks:
      - auction-net

  notificationapi:
    build:
      context: ./NotificationService
      dockerfile: NotificationService.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5008:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - RABBITMQ__HOST=rabbitmq
      - RABBITMQ__USERNAME=notification
      - RABBITMQ__PASSWORD=notification123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - auction-net

  notificationworker:
    build:
      context: ./NotificationService
      dockerfile: NotificationDelivery.Worker/Dockerfile
    restart: unless-stopped
    environment:
      - DOTNET_ENVIRONMENT=Development
      - RABBITMQ__HOST=rabbitmq
      - RABBITMQ__USERNAME=notification
      - RABBITMQ__PASSWORD=notification123
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - auction-net

  identitydb:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB:-IdentityDb}
    ports:
      - "5439:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      - identitydb_data:/var/lib/postgresql/data
    networks:
      - auction-net

  identityapi:
    build:
      context: ./IdentityService
      dockerfile: IdentityService.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5009:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=identitydb;Port=5432;Database=${IDENTITY_POSTGRES_DB:-IdentityDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-change-me}
      Jwt__Key: ${JWT_KEY:-super_secret_key_for_auction_microservices_2026}
      Jwt__Issuer: ${JWT_ISSUER:-AuctionIdentityService}
      Jwt__Audience: ${JWT_AUDIENCE:-AuctionMicroservices}
    depends_on:
      - identitydb
    networks:
      - auction-net

  orderingdb:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${ORDERING_POSTGRES_DB:-OrderingDb}
    ports:
      - "5437:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      - orderingdb_data:/var/lib/postgresql/data
    networks:
      - auction-net

  paymentdb:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${PAYMENT_POSTGRES_DB:-PaymentDb}
    ports:
      - "5438:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      - paymentdb_data:/var/lib/postgresql/data
    networks:
      - auction-net

  orderingapi:
    build:
      context: ./OrderingService
      dockerfile: OrderingService.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=orderingdb;Port=5432;Database=${ORDERING_POSTGRES_DB:-OrderingDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-change-me}
      GrpcSettings__PaymentUrl: http://paymentapi:8081
      Kafka__BootstrapServers: kafka:9093
    depends_on:
      - orderingdb
      - paymentapi
    networks:
      - auction-net

  paymentapi:
    build:
      context: ./PaymentService
      dockerfile: PaymentService.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5006:8080"
      - "5007:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=paymentdb;Port=5432;Database=${PAYMENT_POSTGRES_DB:-PaymentDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-change-me}
    depends_on:
      - paymentdb
    networks:
      - auction-net

  auctionapi:
    build:
      context: ./AuctionService
      dockerfile: AuctionService.Api/Dockerfile
    restart: unless-stopped
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=auctiondb;Port=5432;Database=${AUCTION_POSTGRES_DB:-AuctionDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-change-me}
      Redis__Configuration: redis:6379
      Kafka__BootstrapServers: kafka:9093
    depends_on:
      - auctiondb
      - redis
      - kafka
    networks:
      - auction-net

  realtimeapi:
    build:
      context: ./RealtimeService/RealtimeService.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5102:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Kafka__BootstrapServers: kafka:9093
    depends_on:
      - kafka
    networks:
      - auction-net

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    container_name: auction-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:80"
    networks:
      - auction-net

  apigateway:
    build:
      context: ./ApiGateway/ApiGateway.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      SEQ_URL: http://seq:80
      ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address: http://catalogapi:8080
      ReverseProxy__Clusters__bidding-cluster__Destinations__destination1__Address: http://biddingapi:8080
      ReverseProxy__Clusters__ordering-cluster__Destinations__destination1__Address: http://orderingapi:8080
      ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address: http://paymentapi:8080
      ReverseProxy__Clusters__auction-cluster__Destinations__destination1__Address: http://auctionapi:8080
      ReverseProxy__Clusters__realtime-cluster__Destinations__destination1__Address: http://realtimeapi:8080
      ReverseProxy__Routes__notification-route__ClusterId: notification-cluster
      ReverseProxy__Routes__notification-route__Match__Path: /api/notifications/{**catch-all}
      ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address: http://notificationapi:8080
      ReverseProxy__Routes__identity-route__ClusterId: identity-cluster
      ReverseProxy__Routes__identity-route__Match__Path: /api/auth/{**catch-all}
      ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address: http://identityapi:8080
    depends_on:
      - catalogapi
      - biddingapi
      - orderingapi
      - paymentapi
      - auctionapi
      - realtimeapi
      - identityapi
      - notificationapi
      - seq
    networks:
      - auction-net

volumes:
  catalogdb_data:
  biddingdb_data:
  orderingdb_data:
  paymentdb_data:
  auctiondb_data:
  identitydb_data:
  redis_data:
  rabbitmq_data:

networks:
  auction-net:
    name: auction-net