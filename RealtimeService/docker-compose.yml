services:
  realtimeapi:
    build:
      context: ./RealtimeService.Api
      dockerfile: Dockerfile
    container_name: realtime-service
    ports:
      - "5102:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Kafka__BootstrapServers: kafka:9093
    networks:
      - auction-net

networks:
  auction-net:
    name: auction-net